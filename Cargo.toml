[package]
name = "jhut"
authors = ["Vivek Murali"]
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5" , features = ["json", "cookies"]}
tokio = { version = "1" , features = ["full"]}
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
duckdb = { version = "1.20000.1", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"